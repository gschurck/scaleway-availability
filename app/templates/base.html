<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Historical availability of Scaleway Elastic Metal servers">
    <title>{% block title %}Metal Availability{% endblock %}</title>
    <script src="{{ url_for('static', path='/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <script src="{{ url_for('static', path='/htmx.min.js') }}" defer></script>
  </head>
  <body hx-boost="true">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Metal Availability home">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>
          <strong>Metal Availability</strong>
          <small>Scaleway Elastic Metal history</small>
        </span>
      </a>
      <div class="header-actions">
        <a class="status-link" href="/healthz" hx-boost="false">System status</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" title="Switch to dark theme">
          <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
          <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
        </button>
      </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      Independent availability tracker using the Scaleway API. Times are shown in UTC.
    </footer>
  </body>
</html>
