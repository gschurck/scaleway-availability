[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scaleway-availability"
version = "0.1.0"
description = "Historical availability dashboard for Scaleway Elastic Metal offers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite==0.21.0",
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "fastapi-crons[sqlalchemy]==2.5.0",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.47",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
